# Colores de eza (ls) estilo hacker: verde/cian neon
colourful: true
filekinds:
  normal: {foreground: "#cfe8d8"}
  directory: {foreground: "#00e5ff", is_bold: true}
  symlink: {foreground: "#c77dff"}
  executable: {foreground: "#00ff9c", is_bold: true}
  pipe: {foreground: "#ffd23f"}
  socket: {foreground: "#ffd23f"}
  block_device: {foreground: "#ff3b6b"}
  char_device: {foreground: "#ff3b6b"}
  mount_point: {foreground: "#00e5ff", is_underline: true}
perms:
  user_read: {foreground: "#00ff9c"}
  user_write: {foreground: "#ffd23f"}
  user_execute_file: {foreground: "#00e5ff", is_bold: true}
  user_execute_other: {foreground: "#00e5ff"}
  group_read: {foreground: "#6f8f84"}
  group_write: {foreground: "#6f8f84"}
  group_execute: {foreground: "#6f8f84"}
  other_read: {foreground: "#3b4a45"}
  other_write: {foreground: "#ff3b6b"}
  other_execute: {foreground: "#3b4a45"}
size:
  number_byte: {foreground: "#cfe8d8"}
  number_kilo: {foreground: "#cfe8d8"}
  number_mega: {foreground: "#00e5ff"}
  number_giga: {foreground: "#ffd23f"}
  number_huge: {foreground: "#ff3b6b"}
  unit_byte: {foreground: "#6f8f84"}
  unit_kilo: {foreground: "#6f8f84"}
  unit_mega: {foreground: "#6f8f84"}
  unit_giga: {foreground: "#6f8f84"}
  unit_huge: {foreground: "#6f8f84"}
users:
  user_you: {foreground: "#00ff9c"}
  user_root: {foreground: "#ff3b6b", is_bold: true}
  user_other: {foreground: "#c77dff"}
  group_yours: {foreground: "#6f8f84"}
  group_root: {foreground: "#ff3b6b"}
  group_other: {foreground: "#c77dff"}
date: {foreground: "#6f8f84"}
git:
  new: {foreground: "#00ff9c"}
  modified: {foreground: "#ffd23f"}
  deleted: {foreground: "#ff3b6b"}
  renamed: {foreground: "#00e5ff"}
  ignored: {foreground: "#3b4a45"}
punctuation: {foreground: "#3b4a45"}
