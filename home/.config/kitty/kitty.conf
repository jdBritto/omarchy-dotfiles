# Kitty - estilo hacker. Copia del archivo anterior en backup/kitty.conf.orig
# Recargar sin cerrar: Ctrl+Shift+F5

# Base de Omarchy (atajos Ctrl+Insert/Shift+Insert, Shift+Enter para TUIs, etc.)
include /etc/xdg/kitty/kitty.conf
include hacker-theme.conf

# Abrir siempre con Zsh (bash sigue siendo el shell del sistema)
shell /usr/bin/zsh

# ---------------------------------------------------------------- fuente
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        8.0
disable_ligatures cursor

# ---------------------------------------------------------------- ventana
window_padding_width 12
background_opacity   0.88
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #ff3b6b

# ---------------------------------------------------------------- cursor con estela
cursor_shape            block
cursor_blink_interval   0.6
cursor_stop_blinking_after 15
cursor_trail            3
cursor_trail_decay      0.1 0.35
cursor_trail_start_threshold 2

# ---------------------------------------------------------------- texto y enlaces
scrollback_lines 20000
copy_on_select   yes
strip_trailing_spaces smart
url_style        curly
detect_urls      yes
underline_hyperlinks always

# ---------------------------------------------------------------- pestanas
tab_bar_edge          top
tab_bar_margin_height 4.0 2.0
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_template    "{fmt.fg.red}{bell_symbol}{fmt.fg.tab} {index}: {title[:28]}{' ['+str(num_windows)+']' if num_windows > 1 else ''} "

# ---------------------------------------------------------------- paneles
enabled_layouts splits, stack
inactive_text_alpha 0.65
window_border_width 1.5pt
draw_minimal_borders yes

# Dividir la ventana
map ctrl+shift+enter    launch --location=split --cwd=current
map ctrl+shift+\        launch --location=vsplit --cwd=current
map ctrl+shift+minus    launch --location=hsplit --cwd=current
# Moverse entre paneles
map alt+left            neighboring_window left
map alt+right           neighboring_window right
map alt+up              neighboring_window up
map alt+down            neighboring_window down
# Zoom a un panel (pantalla completa dentro de kitty) y volver
map ctrl+shift+z        toggle_layout stack
# Nueva pestana en la misma carpeta
map ctrl+shift+t        new_tab_with_cwd
# Transparencia al vuelo
map ctrl+shift+a>m      set_background_opacity +0.05
map ctrl+shift+a>l      set_background_opacity -0.05
map ctrl+shift+a>d      set_background_opacity default
